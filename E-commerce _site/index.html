<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce.in</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    
    <div class="nav-container">
        <div class="nav-logo">
            ECOMMERCE
        </div>

        <div id="Home">Home</div>
        <div id="lister">List-Items</div>

        <div id="cart">
            <i class="fa-solid fa-cart-shopping cart-icon"></i>
            <div class="cart-div"></div>
        </div>

    </div>

    <div class="hero-section">
    </div>

    
    <div id="Gaming-Laptops">
        <p>Gaming-Laptops</p>
        <div class="product_listing">
            <div class="product" id="prod1">
                <p class="name">Acer-Predator</p>
                <img src="prod1_img.jpg" alt="">
                <div class="buyerChoice">
                    <div class="price">1,09,990</div>
                    <i class="fa-solid fa-cart-plus addToCart"></i>
                </div>
            </div>
    
            <div class="product" id="prod2">
            <p class="name">DELL-xps</p>
            <img src="61MmNc4mRLL._SX679_.jpg" alt="">
            <div class="buyerChoice">
                <div class="price">3,66,244</div>
                <i class="fa-solid fa-cart-plus addToCart"></i>
            </div>
            </div>
    
            <div class="product" id="prod3">
            <p class="name">ASUS ROG STRIX</p>
            <img src="71qRWDn7yoL._SX679_.jpg" alt="">
            <div class="buyerChoice">
                <div class="price">1,49,990</div>
                <i class="fa-solid fa-cart-plus addToCart"></i>
            </div>
            </div>
    
            <div class="product" id="prod4">
            <p class="name">LENOVO LOQ</p>
            <img src="616fX5Yh00L._SX679_.jpg" alt="">
            <div class="buyerChoice">
                <div class="price">82,690</div>
                <i class="fa-solid fa-cart-plus addToCart"></i>
            </div>
            </div>
    
            <div class="product" id="prod5">
                <p class="name">HP-Omen</p>
                <img src="71S1eXJmIAL._SX679_.jpg" alt="">
                <div class="buyerChoice">
                    <div class="price">1,10,990</div>
                    <i class="fa-solid fa-cart-plus addToCart"></i>
                </div>
            </div>
    
            <div class="product" id="prod6">
                <p class="name">HP-Victus</p>
                <img src="71R98+Z6GTL._SX679_.jpg" alt="">
                <div class="buyerChoice">
                    <div class="price">69,490</div>
                    <i class="fa-solid fa-cart-plus addToCart"></i>
                </div>
            </div>
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
